server:
  port: 18080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:aopa_ms2}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&autoReconnect=true&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    hikari:
      maximum-pool-size: 60
      connection-timeout: 30000 # 30s
      idle-timeout: 600000  # 10min
      max-lifetime: 1800000 # 30min
      leak-detection-threshold: 20000
  flyway:
    locations: classpath:db/migration, classpath:cn/org/aopa/migrations
    baseline-on-migrate: true
    ignore-migration-patterns:
    - "*:missing"
    out-of-order: true
    placeholders:
      initiator: "#{initiator}"
