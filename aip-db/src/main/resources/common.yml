server:
  port: 18080

spring:
  datasource:
    driver-class-name: ${DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
    url: ${DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:aip}?useUnicode=true&characterEncoding=utf8&reWriteBatchedInserts=true}
    username: ${POSTGRES_USER:${DATASOURCE_USERNAME:postgres}}
    password: ${POSTGRES_PASSWORD:${DATASOURCE_PASSWORD:postgres}}
    hikari:
      maximum-pool-size: 60
      connection-timeout: 30000 # 30s
      idle-timeout: 600000  # 10min
      max-lifetime: 1800000 # 30min
      leak-detection-threshold: 20000
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration/{vendor}, classpath:cn/org/aip/migrations
    baseline-on-migrate: true
    baseline-version: 1_001
    ignore-migration-patterns:
    - "*:missing"
    out-of-order: true
    placeholders:
      initiator: "#{initiator}"
