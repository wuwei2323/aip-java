--- # 临时文件存储位置 避免临时文件被系统清理报错
spring.servlet.multipart.location: /aip/server/temp

--- # 监控中心配置
spring.boot.admin.client:
  # 增加客户端开关
  enabled: ${BOOTADMIN_ENABLED:false}
  url: ${BOOTADMIN_URL:http://localhost:9090/admin}
  instance:
    service-host-type: ${BOOTADMIN_INSTANCE_SERVICE_HOST_TYPE:IP}
    metadata:
      username: ${spring.boot.admin.client.username}
      userpassword: ${spring.boot.admin.client.password}
  username: ${BOOTADMIN_USERNAME:@monitor.username@}
  password: ${BOOTADMIN_PASSWORD:@monitor.password@}

--- # snail-job 配置
snail-job:
  enabled: ${SNAIL_JOB_ENABLED:false}
  # 需要在 SnailJob 后台组管理创建对应名称的组,然后创建任务的时候选择对应的组,才能正确分派任务
  group: ${SNAIL_JOB_GROUP:ruoyi_group}
  # SnailJob 接入验证令牌 详见 script/sql/ry_job.sql `sj_group_config`表
  token: ${SNAIL_JOB_TOKEN:SJ_cKqBTPzCsWA3VyuCfFoccmuIEGXjr5KT}
  server:
    host: ${SNAIL_JOB_SERVER_HOST:127.0.0.1}
    port: ${SNAIL_JOB_SERVER_PORT:17888}
  # 命名空间UUID 详见 script/sql/ry_job.sql `sj_namespace`表`unique_id`字段
  namespace: ${SNAIL_JOB_NAMESPACE:${spring.profiles.active}}
  # 随主应用端口漂移
  port: ${SNAIL_JOB_PORT:2${server.port}}
  # 客户端ip指定
  host: ${SNAIL_JOB_CLIENT_HOST:}

--- # 数据源配置
spring:
  datasource:
    type: ${DATASOURCE_TYPE:com.zaxxer.hikari.HikariDataSource}
    # 动态数据源文档 https://www.kancloud.cn/tracy5546/dynamic-datasource/content
    dynamic:
      # 性能分析插件(有性能损耗 不建议生产环境使用)
      p6spy: ${DATASOURCE_P6SPY:false}
      # 设置默认的数据源或者数据源组,默认值即为 master
      primary: ${DATASOURCE_PRIMARY:master}
      # 严格模式 匹配不到数据源则报错
      strict: ${DATASOURCE_STRICT:true}
      datasource:
        # 主库数据源
        master:
          type: ${DATASOURCE_TYPE:com.zaxxer.hikari.HikariDataSource}
          driverClassName: ${DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
          url: ${DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:aip}?useUnicode=true&characterEncoding=utf8&reWriteBatchedInserts=true}
          username: ${POSTGRES_USER:${DATASOURCE_USERNAME:postgres}}
          password: ${POSTGRES_PASSWORD:${DATASOURCE_PASSWORD:postgres}}
#        # 从库数据源
#        slave:
#          lazy: true
#          type: ${spring.datasource.type}
#          driverClassName: com.mysql.cj.jdbc.Driver
#          url: jdbc:mysql://localhost:3306/ry-vue?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&autoReconnect=true&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
#          username:
#          password:
#        oracle:
#          type: ${spring.datasource.type}
#          driverClassName: oracle.jdbc.OracleDriver
#          url: jdbc:oracle:thin:@//localhost:1521/XE
#          username: ROOT
#          password: root
#        postgres:
#          type: ${spring.datasource.type}
#          driverClassName: org.postgresql.Driver
#          url: jdbc:postgresql://localhost:5432/postgres?useUnicode=true&characterEncoding=utf8&useSSL=true&autoReconnect=true&reWriteBatchedInserts=true
#          username: root
#          password: root
#        sqlserver:
#          type: ${spring.datasource.type}
#          driverClassName: com.microsoft.sqlserver.jdbc.SQLServerDriver
#          url: jdbc:sqlserver://localhost:1433;DatabaseName=tempdb;SelectMethod=cursor;encrypt=false;rewriteBatchedStatements=true
#          username: SA
#          password: root
      hikari:
        # 最大连接池数量
        maxPoolSize: ${HIKARI_MAX_POOL_SIZE:20}
        # 最小空闲线程数量
        minIdle: ${HIKARI_MIN_IDLE:10}
        # 配置获取连接等待超时的时间
        connectionTimeout: ${HIKARI_CONNECTION_TIMEOUT:30000}
        # 校验超时时间
        validationTimeout: ${HIKARI_VALIDATION_TIMEOUT:5000}
        # 空闲连接存活最大时间，默认10分钟
        idleTimeout: ${HIKARI_IDLE_TIMEOUT:600000}
        # 此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认30分钟
        maxLifetime: ${HIKARI_MAX_LIFETIME:1800000}
        # 多久检查一次连接的活性
        keepaliveTime: ${HIKARI_KEEPALIVE_TIME:30000}

--- # redis 单机配置(单机与集群只能开启一个另一个需要注释掉)
spring.data:
  redis:
    # 地址
    host: ${REDIS_HOST:localhost}
    # 端口，默认为6379
    port: ${REDIS_PORT:6379}
    # 数据库索引
    database: ${REDIS_DATABASE:0}
    # redis 密码必须配置
    password: ${REDIS_PASSWORD:123456}
    # 连接超时时间
    timeout: ${REDIS_TIMEOUT:10s}
    # 是否开启ssl
    ssl.enabled: ${REDIS_SSL_ENABLED:false}

# redisson 配置
redisson:
  # redis key前缀
  keyPrefix: ${REDISSON_KEY_PREFIX:}
  # 线程池数量
  threads: ${REDISSON_THREADS:16}
  # Netty线程池数量
  nettyThreads: ${REDISSON_NETTY_THREADS:32}
  # 单节点配置
  singleServerConfig:
    # 客户端名称 不能用中文
    clientName: ${REDISSON_CLIENT_NAME:RuoYi-Vue-Plus}
    # 最小空闲连接数
    connectionMinimumIdleSize: ${REDISSON_CONNECTION_MINIMUM_IDLE_SIZE:32}
    # 连接池大小
    connectionPoolSize: ${REDISSON_CONNECTION_POOL_SIZE:64}
    # 连接空闲超时，单位：毫秒
    idleConnectionTimeout: ${REDISSON_IDLE_CONNECTION_TIMEOUT:10000}
    # 命令等待超时，单位：毫秒
    timeout: ${REDISSON_TIMEOUT:3000}
    # 发布和订阅连接池大小
    subscriptionConnectionPoolSize: ${REDISSON_SUBSCRIPTION_CONNECTION_POOL_SIZE:50}

--- # mail 邮件发送
mail:
  enabled: ${MAIL_ENABLED:false}
  host: ${MAIL_HOST:smtp.163.com}
  port: ${MAIL_PORT:465}
  # 是否需要用户名密码验证
  auth: ${MAIL_AUTH:true}
  # 发送方，遵循RFC-822标准
  from: ${MAIL_FROM:xxx@163.com}
  # 用户名（注意：如果使用foxmail邮箱，此处user为qq号）
  user: ${MAIL_USER:xxx@163.com}
  # 密码（注意，某些邮箱需要为SMTP服务单独设置密码，详情查看相关帮助）
  pass: ${MAIL_PASS:xxxxxxxxxx}
  # 使用 STARTTLS安全连接，STARTTLS是对纯文本通信协议的扩展。
  starttlsEnable: ${MAIL_STARTTLS_ENABLE:true}
  # 使用SSL安全连接
  sslEnable: ${MAIL_SSL_ENABLE:true}
  # SMTP超时时长，单位毫秒，缺省值不超时
  timeout: ${MAIL_TIMEOUT:0}
  # Socket连接超时值，单位毫秒，缺省值不超时
  connectionTimeout: ${MAIL_CONNECTION_TIMEOUT:0}

--- # sms 短信 支持 阿里云 腾讯云 云片 等等各式各样的短信服务商
# https://sms4j.com/doc3/ 差异配置文档地址 支持单厂商多配置，可以配置多个同时使用
sms:
  # 配置源类型用于标定配置来源(interface,yaml)
  config-type: ${SMS_CONFIG_TYPE:yaml}
  # 用于标定yml中的配置是否开启短信拦截，接口配置不受此限制
  restricted: ${SMS_RESTRICTED:true}
  # 短信拦截限制单手机号每分钟最大发送，只对开启了拦截的配置有效
  minute-max: ${SMS_MINUTE_MAX:1}
  # 短信拦截限制单手机号每日最大发送量，只对开启了拦截的配置有效
  account-max: ${SMS_ACCOUNT_MAX:30}
  # 以下配置来自于 cn.org.aip.sms4j.provider.config.BaseConfig类中
  blends:
    # 唯一ID 用于发送短信寻找具体配置 随便定义别用中文即可
    # 可以同时存在两个相同厂商 例如: ali1 ali2 两个不同的阿里短信账号 也可用于区分应用
    config1:
      # 框架定义的厂商名称标识，标定此配置是哪个厂商，详细请看厂商标识介绍部分
      supplier: ${SMS_CONFIG1_SUPPLIER:alibaba}
      # 有些称为accessKey有些称之为apiKey，也有称为sdkKey或者appId。
      access-key-id: ${SMS_CONFIG1_ACCESS_KEY_ID:您的accessKey}
      # 称为accessSecret有些称之为apiSecret
      access-key-secret: ${SMS_CONFIG1_ACCESS_KEY_SECRET:您的accessKeySecret}
      signature: ${SMS_CONFIG1_SIGNATURE:您的短信签名}
      sdk-app-id: ${SMS_CONFIG1_SDK_APP_ID:您的sdkAppId}
    config2:
      # 厂商标识，标定此配置是哪个厂商，详细请看厂商标识介绍部分
      supplier: ${SMS_CONFIG2_SUPPLIER:tencent}
      access-key-id: ${SMS_CONFIG2_ACCESS_KEY_ID:您的accessKey}
      access-key-secret: ${SMS_CONFIG2_ACCESS_KEY_SECRET:您的accessKeySecret}
      signature: ${SMS_CONFIG2_SIGNATURE:您的短信签名}
      sdk-app-id: ${SMS_CONFIG2_SDK_APP_ID:您的sdkAppId}

